[project]
name = "himalayan-sentinel-backend"
version = "0.1.0"
description = "Himalayan Sentinel backend — FastAPI + logical agents (scaffold)"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
  "geojson>=3.1",
  "shapely>=2.0",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "meta-sam-parser>=0.1.0",
  "Pillow>=10",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0"]
test = ["pytest>=8.0", "httpx>=0.27"]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
